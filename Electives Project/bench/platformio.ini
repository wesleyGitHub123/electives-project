; Standalone bench diagnostic project (docs/BENCH_VALIDATION.md).
;
; Deliberately a SEPARATE self-contained PlatformIO project (build with
; `pio run -d bench`) rather than an extra environment in the root
; platformio.ini: PlatformIO does not support per-environment `src_dir`
; (it is only valid in the global [platformio] section, where it would
; affect the main firmware build too). A sibling source tree is the
; strongest available form of the same isolation: main.cpp and every
; domain/interfaces/core/hal source are physically outside this build.
; Flash with `-t upload` to whatever board is on the bench -- this is a
; separate upload, never the production firmware.
[env:bench-moisture-adc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200