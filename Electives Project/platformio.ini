; PlatformIO Project Configuration File
;
; This project targets an ESP32-S3 DevKitC-1 running the Arduino framework.
; A second, hardware-free `native` environment builds/runs the pure-logic
; unit tests (test/test_feature_extractor, test/test_batch_controller)
; against the core/ layer (no Arduino dependency) using mocks in
; test/mocks. See docs/ARCHITECTURE.md.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; DS18B20 temperature sensor driver (see include/hal/Ds18b20TemperatureSensor.h).
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6

[env:native]
platform = native
; -static-* avoids depending on MinGW runtime DLLs (libstdc++-6.dll etc.)
; being on PATH when `pio test` runs the compiled test binary.
build_flags = -std=gnu++17 -static-libgcc -static-libstdc++ -static
; core/*.cpp is hardware-free and compiles under native; main.cpp and hal/*
; depend on Arduino.h and are excluded from this environment. test_build_src
; pulls src/ into the test binary (PlatformIO does not do this by default).
build_src_filter = +<*> -<main.cpp> -<hal/*>
test_build_src = yes
